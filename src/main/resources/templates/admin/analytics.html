<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin overview - ContextEnglish</title>
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container page-wrap">
  <div class="page-header">
    <h1>Admin overview</h1>
    <p class="text-muted">A quick snapshot of the platform.</p>
  </div>

  <div class="grid grid-3">
    <div class="stat-card">
      <span class="stat-value" th:text="${totalLearners}">0</span>
      <span class="stat-label">Learners</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" th:text="${totalPassages}">0</span>
      <span class="stat-label">Passages</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" th:text="${totalSessionsCompleted}">0</span>
      <span class="stat-label">Sessions completed</span>
    </div>
  </div>

  <div class="flex gap-16" style="margin-top:28px; flex-wrap:wrap;">
    <a th:href="@{/admin/content}" class="btn btn-primary">Manage content</a>
    <a th:href="@{/admin/users}" class="btn btn-outline">Manage users</a>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
