<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${passage.title} + ' - ContextEnglish'">Session - ContextEnglish</title>
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container page-wrap">

  <div class="page-header flex-between flex-wrap gap-12">
    <div>
      <span class="level-badge" th:classappend="'level-' + ${#strings.toLowerCase(passage.level.name())}"
            th:text="${passage.level}">LEVEL</span>
      <h1 th:text="${passage.title}" style="margin-top:10px;">Passage title</h1>
      <p class="text-muted" th:if="${passage.topic}" th:text="'Topic: ' + ${passage.topic}">Topic</p>
    </div>
    <div style="min-width:220px;">
      <div class="progress-track"><div class="progress-fill" id="sessionProgressFill" style="width:0%"></div></div>
      <p class="text-muted" style="margin:4px 0 0 0; font-size:0.85rem;">
        <span id="answeredCount">0</span> of <span th:text="${#lists.size(targetItems)}">0</span> words explored
      </p>
    </div>
  </div>

  <div class="passage-card" id="passageCard" th:utext="${highlightedHtml}">
    Passage content with <span class="target-word">highlighted</span> words appears here.
  </div>

  <p class="text-muted" style="margin-top:16px;">
    Tap any highlighted word or phrase to guess its meaning from context.
  </p>

  <div class="flex-between" style="margin-top:28px;">
    <a th:href="@{/dashboard}" class="btn btn-ghost">&larr; Back to dashboard</a>
    <form th:action="@{'/session/' + ${attempt.id} + '/complete'}" method="post" id="finishSessionForm">
      <button type="submit" class="btn btn-primary" id="finishSessionBtn" disabled>Finish session</button>
    </form>
  </div>
</div>

<!-- Answer panel (populated dynamically by session.js) -->
<div class="answer-panel-backdrop" id="answerBackdrop">
  <div class="answer-panel" id="answerPanel">
    <span class="item-type-tag" id="answerItemType">WORD</span>
    <h3 id="answerWordTitle">word</h3>
    <p class="text-muted" id="answerPrompt">What does this mean in the sentence above?</p>

    <div id="answerWidgetArea"></div>

    <p class="hint-link" id="hintToggle" style="display:none;">Show a hint</p>
    <p class="text-muted" id="hintText" style="display:none; font-size:0.85rem;"></p>

    <div class="flex gap-12" style="margin-top:16px;">
      <button class="btn btn-primary" id="submitAnswerBtn">Submit answer</button>
      <button class="btn btn-ghost" id="closeAnswerBtn" type="button">Close</button>
    </div>

    <div class="feedback-box" id="feedbackBox">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div id="feedbackExplanation"></div>
      <div class="feedback-native" id="feedbackNative"></div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:inline="javascript">
  /*<![CDATA[*/
  window.CONTEXT_ENGLISH = {
    sessionAttemptId: /*[[${attempt.id}]]*/ 0,
    targetItems: /*[[${targetItems}]]*/ []
  };
  /*]]>*/
</script>
<script th:src="@{/js/session.js}"></script>
</body>
</html>
