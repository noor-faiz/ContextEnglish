<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create account - ContextEnglish</title>
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-narrow page-wrap">
  <div class="card">
    <h2 class="text-center">Create your account</h2>
    <p class="text-center text-muted">Free to join. Takes less than a minute.</p>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" th:field="*{username}" required/>
        <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}" required/>
        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}" required/>
        <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        <div class="field-hint">At least 6 characters.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="text-center text-muted" style="margin-top:18px;">
      Already have an account? <a th:href="@{/login}">Log in</a>
    </p>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
