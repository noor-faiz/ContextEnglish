<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile - ContextEnglish</title>
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-narrow page-wrap">

  <div class="page-header">
    <h1>Profile</h1>
    <p class="text-muted" th:text="${user.username} + ' &middot; ' + ${user.email}">username · email</p>
  </div>

  <div class="alert alert-success" th:if="${preferencesSaved}">Preferences updated.</div>
  <div class="alert alert-success" th:if="${passwordChanged}">Password changed successfully.</div>
  <div class="alert alert-error" th:if="${passwordError}" th:text="${passwordError}">Error</div>

  <div class="card" style="margin-bottom:20px;">
    <h3>Preferences</h3>
    <form th:action="@{/profile/preferences}" th:object="${preferenceUpdateRequest}" method="post">
      <div class="form-group">
        <label for="nativeLanguage">Preferred language for explanations</label>
        <select id="nativeLanguage" th:field="*{nativeLanguage}">
          <option value="bn">Bangla (বাংলা)</option>
          <option value="en">English only</option>
          <option value="hi">Hindi</option>
          <option value="ur">Urdu</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="dailyGoalMinutes">Daily practice goal (minutes)</label>
        <input type="number" id="dailyGoalMinutes" th:field="*{dailyGoalMinutes}" min="5" max="120"/>
      </div>
      <div class="form-group">
        <label for="topicsOfInterest">Topics you enjoy</label>
        <input type="text" id="topicsOfInterest" th:field="*{topicsOfInterest}"/>
      </div>
      <div class="form-group checkbox-row">
        <input type="checkbox" id="stretchMode" th:field="*{stretchMode}"/>
        <label for="stretchMode" style="margin:0;">Stretch mode (slightly harder content)</label>
      </div>
      <button type="submit" class="btn btn-primary">Save preferences</button>
    </form>
  </div>

  <div class="card">
    <h3>Change password</h3>
    <form th:action="@{/profile/password}" th:object="${changePasswordRequest}" method="post">
      <div class="form-group">
        <label for="currentPassword">Current password</label>
        <input type="password" id="currentPassword" th:field="*{currentPassword}" required/>
      </div>
      <div class="form-group">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" th:field="*{newPassword}" required/>
      </div>
      <button type="submit" class="btn btn-outline">Change password</button>
    </form>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
