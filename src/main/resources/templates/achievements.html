<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Achievements - ContextEnglish</title>
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container page-wrap">
  <div class="page-header">
    <h1>Achievements</h1>
    <p class="text-muted" th:text="${earned.size()} + ' of ' + ${allAchievements.size()} + ' unlocked'">0 of 0 unlocked</p>
  </div>

  <div class="achievement-grid">
    <div th:each="a : ${allAchievements}"
         class="achievement-badge" th:classappend="${earnedIds.contains(a.id)} ? '' : 'locked'">
      <div class="badge-icon" th:text="${a.icon}">🏆</div>
      <strong th:text="${a.title}">Title</strong>
      <p class="text-muted" style="font-size:0.82rem;" th:text="${a.description}">Description</p>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
