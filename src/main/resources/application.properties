# ============================================================================
# ContextEnglish - base configuration (safe to commit to git)
# ============================================================================
# No real secrets live in this file. Values come from environment variables
# in production (e.g. on Render, set these in the service's Environment tab),
# or from application-local.properties for local development, which is
# git-ignored and contains your actual Supabase credentials.
# ============================================================================

spring.application.name=contextenglish

# --- Database (Supabase Postgres) ---
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# --- JPA / Hibernate ---
# ddl-auto=update auto-creates/updates tables on startup - convenient for a
# student project against a fresh Supabase DB. For a stricter production
# setup later, consider migrating to Flyway with ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
# Cache disabled by default for easy template editing; set to true for production if desired.
spring.thymeleaf.cache=false

# --- Server ---
# Render injects $PORT at runtime; 8080 is used for local development.
server.port=${PORT:8080}
server.address=0.0.0.0
server.error.include-message=always

# --- Supabase project info (reserved for optional future use, e.g. Supabase Storage) ---
app.supabase.url=${SUPABASE_URL:}
app.supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
app.supabase.secret-key=${SUPABASE_SECRET_KEY:}

# --- Logging ---
logging.level.org.springframework.security=INFO
logging.level.com.contextenglish=INFO
